# Observabilidade do Dokploy Pessoal (Loki + Grafana + Promtail).
# Mesmo padrão do checkout: Loki NÃO publica 3100; Grafana só via Traefik (sslip.io HTTPS).
# Promtail lê docker.sock e coleta logs de TODOS os containers do host (exceto o próprio Promtail).
# Senha do Grafana: GF_SECURITY_ADMIN_PASSWORD no ambiente Dokploy — nunca no git.

networks:
  logs:
    name: dokploy-logs-internal
    driver: bridge
    internal: true
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  loki_data:
    name: dokploy_loki_data
  grafana_data:
    name: dokploy_grafana_data
  promtail_positions:
    name: dokploy_promtail_positions

services:
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    user: root
    expose:
      - "3100"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /loki/chunks /loki/rules /loki/index /loki/compactor
        chown -R 10001:10001 /loki
        cat > /tmp/loki.yaml << 'LOKI'
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9096
          log_level: info
        common:
          instance_addr: 127.0.0.1
          path_prefix: /loki
          storage:
            filesystem:
              chunks_directory: /loki/chunks
              rules_directory: /loki/rules
          replication_factor: 1
          ring:
            kvstore:
              store: inmemory
        schema_config:
          configs:
            - from: "2020-10-24"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        compactor:
          working_directory: /loki/compactor
          compaction_interval: 10m
          retention_enabled: true
          retention_delete_delay: 2h
          retention_delete_worker_count: 150
          delete_request_store: filesystem
        limits_config:
          retention_period: 2160h
          reject_old_samples: true
          reject_old_samples_max_age: 2160h
          max_entries_limit_per_query: 100000
          volume_enabled: true
          volume_max_series: 10000
        LOKI
        exec /usr/bin/loki -config.file=/tmp/loki.yaml
    volumes:
      - loki_data:/loki
    networks:
      - logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Defina GF_SECURITY_ADMIN_PASSWORD no ambiente Dokploy}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_UI_DATE_FORMAT: "DD/MM/YYYY"
      GF_INTERNATIONALIZATION_DEFAULT_LANGUAGE: pt-BR
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logs
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/promtail.yaml << 'PROMTAIL'
        server:
          http_listen_port: 9080
          grpc_listen_port: 0
        positions:
          filename: /var/lib/promtail/positions.yaml
        clients:
          - url: http://loki:3100/loki/api/v1/push
        scrape_configs:
          - job_name: docker
            docker_sd_configs:
              - host: unix:///var/run/docker.sock
                refresh_interval: 5s
            relabel_configs:
              - source_labels: [__meta_docker_container_name]
                regex: '.*promtail.*'
                action: drop
              - action: replace
                replacement: docker
                target_label: job
              - source_labels: [__meta_docker_container_name]
                target_label: container
              - source_labels: [__meta_docker_container_name]
                regex: '/(.+)-([A-Za-z0-9_]+)-[0-9]+'
                replacement: '$${1}'
                target_label: compose
              - source_labels: [__meta_docker_container_name]
                regex: '/(.+)-([A-Za-z0-9_]+)-[0-9]+'
                replacement: '$${2}'
                target_label: service
              - source_labels: [__meta_docker_container_name]
                regex: '/([^.]+)\.[0-9]+\..+'
                replacement: '$${1}'
                target_label: compose
              - source_labels: [compose]
                regex: '^$'
                replacement: standalone
                target_label: compose
            pipeline_stages:
              - docker: {}
              - drop:
                  older_than: 48h
                  drop_counter_reason: too_old
              - static_labels:
                  job: docker
        PROMTAIL
        exec /usr/bin/promtail -config.file=/tmp/promtail.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logs
